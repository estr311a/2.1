<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Desktopowy - Julia Kluga</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="window-container">
    <div class="calculator-card">
      <div class="calc-main">
        <div class="display-panel">
          <div class="memory-badge" id="memoryBadge"></div>
          <div class="expression" id="exprDisplay"></div>
          <div class="current-value" id="mainDisplay">0</div>
        </div>

        <div class="keypad">
          <!-- Row 1: Memory & Clear -->
          <button class="btn btn-mem" data-action="mc">MC</button>
          <button class="btn btn-mem" data-action="mr">MR</button>
          <button class="btn btn-mem" data-action="mplus">M+</button>
          <button class="btn btn-mem" data-action="mminus">M-</button>
          <button class="btn btn-danger" data-action="c">C</button>

          <!-- Row 2: Special operations -->
          <button class="btn btn-fn" data-action="ce">CE</button>
          <button class="btn btn-fn" data-action="backspace">⌫</button>
          <button class="btn btn-fn" data-action="negate">±</button>
          <button class="btn btn-fn" data-action="sqrt">√</button>
          <button class="btn btn-op" data-action="div">÷</button>

          <!-- Row 3: 7-9 & multiply -->
          <button class="btn btn-num" data-num="7">7</button>
          <button class="btn btn-num" data-num="8">8</button>
          <button class="btn btn-num" data-num="9">9</button>
          <button class="btn btn-fn" data-action="sqr">x²</button>
          <button class="btn btn-op" data-action="mul">×</button>

          <!-- Row 4: 4-6 & minus -->
          <button class="btn btn-num" data-num="4">4</button>
          <button class="btn btn-num" data-num="5">5</button>
          <button class="btn btn-num" data-num="6">6</button>
          <button class="btn btn-fn" data-action="recip">1/x</button>
          <button class="btn btn-op" data-action="sub">−</button>

          <!-- Row 5: 1-3 & plus -->
          <button class="btn btn-num" data-num="1">1</button>
          <button class="btn btn-num" data-num="2">2</button>
          <button class="btn btn-num" data-num="3">3</button>
          <button class="btn btn-fn" data-action="percent">%</button>
          <button class="btn btn-op" data-action="add">+</button>

          <!-- Row 6: 0, decimal, equals -->
          <button class="btn btn-fn" id="btnToggleHistory">Hist</button>
          <button class="btn btn-num" data-num="0">0</button>
          <button class="btn btn-num" data-action="dot">.</button>
          <button class="btn btn-equals" data-action="equals">=</button>
        </div>
      </div>

      <div class="history-panel" id="historyPanel">
        <div class="history-header">
          <h3>Historia obliczeń</h3>
          <button id="btnClearHistory" title="Wyczyść historię">🗑 Wyczyść</button>
        </div>
        <div class="history-list" id="historyList">
          <div class="empty-hint">Brak wcześniejszych obliczeń</div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
